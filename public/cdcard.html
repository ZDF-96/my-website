<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quantum Aura · 典藏级背景</title>

<style>
/* =========================================
   GLOBAL RESET & BASE
========================================= */
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
    width:100%; height:100%;
    overflow:hidden;
    /* 极致纯净的深渊黑作为底色 */
    background-color: #010103;
    font-family: 'JetBrains Mono', 'SF Pro Display', -apple-system, sans-serif;
}

canvas {
    position:fixed; inset:0;
    width:100%; height:100%;
    display:block;
    /* 核心：添加轻微的对比度提升和高斯模糊，让光晕更加丝滑连贯 */
    filter: contrast(1.1) drop-shadow(0 0 15px rgba(34, 211, 238, 0.05));
}

/* =========================================
   CINEMATIC VIGNETTE (电影级暗角与阅读保护)
========================================= */
.vignette {
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:
        /* 强力的中心暗场保护，确保文字具有最高对比度 */
        radial-gradient(ellipse at center, rgba(1,1,3,0.6) 0%, rgba(1,1,3,0.1) 45%, transparent 70%),
        /* 四周的深沉压暗 */
        radial-gradient(circle at top left, rgba(0,0,0,0.8) 0%, transparent 50%),
        radial-gradient(circle at bottom right, rgba(0,0,0,0.8) 0%, transparent 50%);
}

/* =========================================
   SUBTLE NOISE TEXTURE (高级胶片噪点)
========================================= */
.grain {
    position:fixed; inset:0; z-index:3; pointer-events:none;
    opacity: 0.025; /* 极低的存在感，仅提供质感 */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
}

/* =========================================
   HOLOGRAPHIC HUD (全息极简控制面板)
========================================= */
.hud-container {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    /* 边缘微弱光晕包裹整个屏幕 */
    box-shadow: inset 0 0 100px rgba(34,211,238,0.02);
}

/* 顶部状态栏 */
.top-bar {
    position: absolute; top: 30px; left: 40px; right: 40px;
    display: flex; justify-content: space-between; align-items: flex-start;
}

.system-id {
    color: rgba(255,255,255,0.7);
    font-size: 10px; letter-spacing: 0.3em;
    font-weight: 500;
    display: flex; align-items: center; gap: 12px;
}
.system-id::before {
    content: ''; width: 24px; height: 1px; background: rgba(34,211,238,0.6);
}

/* 动态呼吸红点 */
.status-indicator {
    display: flex; align-items: center; gap: 8px;
    color: rgba(255,255,255,0.3); font-size: 9px; letter-spacing: 0.2em;
}
.dot {
    width: 4px; height: 4px; background: #22d3ee; border-radius: 50%;
    box-shadow: 0 0 8px #22d3ee;
    animation: blink 3s ease-in-out infinite;
}

/* 底部数据流 */
.bottom-bar {
    position: absolute; bottom: 30px; left: 40px;
    color: rgba(34,211,238,0.4);
    font-size: 9px; letter-spacing: 0.2em;
    line-height: 1.8;
}
.data-line { overflow: hidden; white-space: nowrap; }
.data-line span {
    display: inline-block;
    animation: typing 10s steps(40, end) infinite;
}

@keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
@keyframes typing { 0%, 20% { width: 0; opacity: 0;} 30%, 90% { width: 100%; opacity: 1;} 100% { width: 100%; opacity: 0;} }

</style>
</head>
<body>

<canvas id="quantumCanvas"></canvas>
<div class="vignette"></div>
<div class="grain"></div>

<div class="hud-container">
    <div class="top-bar">
        <div class="system-id">Q-FIELD / RESONANCE MATRIX</div>
        <div class="status-indicator">
            <span class="dot"></span>
            SYNC ESTABLISHED
        </div>
    </div>
    <div class="bottom-bar">
        <div class="data-line"><span>> U(3) CHIRAL SYMMETRY : STABLE</span></div>
        <div class="data-line" style="animation-delay: 2s;"><span>> PERTURBATION ENGINE : RUNNING</span></div>
    </div>
</div>

<script>
const canvas = document.getElementById('quantumCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // 优化性能，明确不需要透明背景

let width, height, cx, cy;
let targetCx, targetCy;
let time = 0;

// 物理引擎核心参数
const CONFIG = {
    particleCount: 180,       // 克制的数量
    baseRadius: 100,          // 发生器核心半径
    colors: [
        { r: 34, g: 211, b: 238 },  // Cyan
        { r: 129, g: 140, b: 248 }, // Indigo
        { r: 192, g: 132, b: 252 }  // Purple
    ]
};

let particles = [];
let rings = [];

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    cx = width / 2;
    cy = height / 2;
    targetCx = cx;
    targetCy = cy;
    initSystem();
}
window.addEventListener('resize', resize);

// 高级缓动函数
function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

// =========================================
// 核心：流体力学粒子
// =========================================
class FluidParticle {
    constructor() {
        this.reset();
        // 初始时随机分布，避免一开始从中心爆发的生硬感
        this.x = cx + (Math.random() - 0.5) * width;
        this.y = cy + (Math.random() - 0.5) * height;
    }

    reset() {
        this.angle = Math.random() * Math.PI * 2;
        this.radius = Math.random() * CONFIG.baseRadius * 0.5;
        this.x = cx + Math.cos(this.angle) * this.radius;
        this.y = cy + Math.sin(this.angle) * this.radius;
        
        this.speed = Math.random() * 0.8 + 0.2; // 极度舒缓的速度
        this.size = Math.random() * 1.5 + 0.5;
        
        // 寿命极长，形成长线条
        this.life = 0;
        this.maxLife = Math.random() * 400 + 200;
        
        this.color = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
        
        // 用于生成流体轨迹的专属参数
        this.noiseScale = Math.random() * 0.005 + 0.002;
        this.noiseOffset = Math.random() * 1000;
        
        this.history = [];
    }

    update() {
        this.history.push({ x: this.x, y: this.y });
        if (this.history.length > 25) this.history.shift(); // 超长拖尾

        // 复杂的复合三角函数模拟柏林噪声，产生柔美的流体涡旋
        const nx = Math.cos(this.y * this.noiseScale + time * 0.001 + this.noiseOffset);
        const ny = Math.sin(this.x * this.noiseScale + time * 0.001 + this.noiseOffset);
        
        this.x += nx * this.speed;
        this.y += ny * this.speed;

        // 微弱的引力，向鼠标目标点缓慢靠拢
        this.x += (targetCx - this.x) * 0.0005;
        this.y += (targetCy - this.y) * 0.0005;

        this.life++;
        if (this.life > this.maxLife) this.reset();
    }

    draw() {
        // 淡入淡出，绝对平滑的生灭
        let opacity = 1;
        const fadeRatio = 0.2;
        if (this.life < this.maxLife * fadeRatio) {
            opacity = this.life / (this.maxLife * fadeRatio);
        } else if (this.life > this.maxLife * (1 - fadeRatio)) {
            opacity = (this.maxLife - this.life) / (this.maxLife * fadeRatio);
        }
        opacity *= 0.4; // 整体压低亮度

        // 绘制丝滑的光绘拖尾
        if (this.history.length > 1) {
            ctx.beginPath();
            ctx.moveTo(this.history[0].x, this.history[0].y);
            for (let i = 1; i < this.history.length; i++) {
                ctx.lineTo(this.history[i].x, this.history[i].y);
            }
            ctx.strokeStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${opacity})`;
            ctx.lineWidth = this.size;
            ctx.stroke();
        }

        // 绘制粒子头部的高光
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.8})`;
        ctx.fill();
    }
}

// =========================================
// 精密几何：同心扩张扫描波
// =========================================
class PrecisionRing {
    constructor() {
        this.r = 0;
        this.maxR = Math.max(width, height) * 0.8;
        this.speed = Math.random() * 0.5 + 0.2;
    }
    update() {
        this.r += this.speed;
        if (this.r > this.maxR) {
            this.r = 0;
            this.speed = Math.random() * 0.5 + 0.2;
        }
    }
    draw() {
        const opacity = (1 - this.r / this.maxR) * 0.03; // 极其微弱的几何线
        ctx.beginPath();
        ctx.arc(cx, cy, this.r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(34, 211, 238, ${opacity})`;
        ctx.lineWidth = 0.5; // 极细线，体现精密感
        ctx.stroke();
    }
}

function initSystem() {
    particles = [];
    for (let i = 0; i < CONFIG.particleCount; i++) particles.push(new FluidParticle());
    
    rings = [];
    for (let i = 0; i < 3; i++) {
        let ring = new PrecisionRing();
        ring.r = (i / 3) * ring.maxR; // 错开初始大小
        rings.push(ring);
    }
}

function drawAmbientCore() {
    // 核心的幽暗发光体，提供基础的环境光照明
    const pulse = Math.sin(time * 0.005) * 50 + 200;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, pulse);
    grad.addColorStop(0, 'rgba(129, 140, 248, 0.08)'); // 靛蓝内芯
    grad.addColorStop(0.5, 'rgba(34, 211, 238, 0.03)'); // 青色过渡
    grad.addColorStop(1, 'rgba(1, 1, 3, 0)');
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
    ctx.fill();
}

function animate() {
    time++;
    
    // 完美的深渊黑底色清理，摒弃之前的 rgba 拖影（因为有了更高级的 history 拖尾机制）
    ctx.fillStyle = '#010103';
    ctx.fillRect(0, 0, width, height);

    // 绘制核心光场
    drawAmbientCore();

    // 开启屏幕滤色模式，使得光线交汇处自然提亮
    ctx.globalCompositeOperation = 'screen';
    
    // 绘制精密几何扫描波
    rings.forEach(r => { r.update(); r.draw(); });

    // 绘制流体粒子
    particles.forEach(p => { p.update(); p.draw(); });

    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(animate);
}

// =========================================
// 交互：高级阻尼鼠标跟随
// =========================================
function updateMouseTarget(e) {
    targetCx = e.clientX;
    targetCy = e.clientY;
}

window.addEventListener('mousemove', updateMouseTarget);
try {
    if (window.parent && window.parent !== window) {
        window.parent.addEventListener('mousemove', updateMouseTarget);
    }
} catch (err) {}

function smoothFollow() {
    // 极致舒缓的跟随，宛如镜头缓慢平移
    cx = lerp(cx, targetCx || width/2, 0.01);
    cy = lerp(cy, targetCy || height/2, 0.01);
    requestAnimationFrame(smoothFollow);
}

resize();
smoothFollow();
animate();

</script>
</body>
</html>
