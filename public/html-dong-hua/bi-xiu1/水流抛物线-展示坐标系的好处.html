<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>大学物理仿真实验 - 斜抛运动与位移矢量分析 (深色科研版)</title>
    <style>
        :root {
            --bg-color: #020617;
            --panel-bg: #0f172a;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .main-wrapper {
            display: flex;
            gap: 24px;
            background: var(--panel-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .canvas-container {
            position: relative;
            background: #000000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        .sidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
        }

        .header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 24px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .control-header label {
            font-weight: 500;
            color: var(--text-main);
        }

        .control-header span {
            color: var(--primary);
            font-family: "Cambria Math", "Times New Roman", serif;
            font-style: italic;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #334155;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .stats-panel {
            background: #020617;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            flex-grow: 1;
        }

        .stats-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 10px;
            border-bottom: 1px dashed #334155;
            padding-bottom: 4px;
        }

        .stat-row:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .stat-row span:first-child {
            color: var(--text-secondary);
        }

        .stat-row span:last-child {
            color: var(--text-main);
            font-family: "Cambria Math", "Times New Roman", serif;
        }

        .actions {
            margin-top: 16px;
        }

        button {
            width: 100%;
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #334155;
            border-color: #475569;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="canvas-container">
        <canvas id="simCanvas" width="900" height="540"></canvas>
    </div>
    
    <div class="sidebar">
        <div class="header">
            <h1>实验 2.4：抛体运动与位移矢量</h1>
            <p>基于流体力学与运动学方程的可视化分析</p>
        </div>
        
        <div class="controls-group">
            <div class="control-item">
                <div class="control-header">
                    <label for="v0Range">初速度 (v₀)</label>
                    <span id="v0Val">20.0 m/s</span>
                </div>
                <input type="range" id="v0Range" min="10" max="32" value="20" step="0.5">
            </div>

            <div class="control-item">
                <div class="control-header">
                    <label for="angleRange">发射角 (θ)</label>
                    <span id="angleVal">45°</span>
                </div>
                <input type="range" id="angleRange" min="15" max="85" value="45" step="1">
            </div>
        </div>

        <div class="stats-panel">
            <div class="stats-title">实验观测数据</div>
            <div class="stat-row">
                <span>最大射程 (R):</span>
                <span id="rangeVal">0.00 m</span>
            </div>
            <div class="stat-row">
                <span>最高点 (H):</span>
                <span id="heightVal">0.00 m</span>
            </div>
            <div class="stat-row">
                <span>飞行时间 (T):</span>
                <span id="timeVal">0.00 s</span>
            </div>
        </div>

        <div class="actions">
            <button id="resetBtn">重置仿真系统</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

const v0Range = document.getElementById('v0Range');
const angleRange = document.getElementById('angleRange');
const v0Val = document.getElementById('v0Val');
const angleVal = document.getElementById('angleVal');
const timeVal = document.getElementById('timeVal');
const heightVal = document.getElementById('heightVal');
const rangeVal = document.getElementById('rangeVal');
const resetBtn = document.getElementById('resetBtn');

const g = 9.80665; 
const scale = 14; 
const originX = 60;  
const originY = 480; 

let v0 = parseFloat(v0Range.value);
let thetaDeg = parseFloat(angleRange.value);
let theta = thetaDeg * Math.PI / 180;

let particles = [];
let spawnTimer = 0;
const spawnInterval = 0.02; 

class WaterParticle {
    constructor(v0, theta) {
        this.x = 0;
        this.y = 0;
        let vVar = v0 * (0.99 + Math.random() * 0.02);
        let tVar = theta + (Math.random() - 0.5) * 0.015;
        this.vx = vVar * Math.cos(tVar);
        this.vy = vVar * Math.sin(tVar);
        this.life = 0;
        this.maxLife = 6.0;
        this.radius = 1.0 + Math.random() * 1.0;
        this.alpha = 0.5 + Math.random() * 0.3;
    }

    update(dt) {
        this.life += dt;
        this.x = this.vx * this.life;
        this.y = this.vy * this.life - 0.5 * g * this.life * this.life;
    }

    draw(ctx) {
        if (this.y >= 0) {
            let px = originX + this.x * scale;
            let py = originY - this.y * scale;

            ctx.beginPath();
            ctx.arc(px, py, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(56, 189, 248, ${this.alpha})`;
            ctx.fill();
        }
    }
}

function updateParams() {
    v0 = parseFloat(v0Range.value);
    thetaDeg = parseFloat(angleRange.value);
    theta = thetaDeg * Math.PI / 180;
    v0Val.innerText = v0.toFixed(1) + ' m/s';
    angleVal.innerText = thetaDeg + '°';
}

function resetSimulation() {
    particles = [];
    updateParams();
}

v0Range.addEventListener('input', updateParams);
angleRange.addEventListener('input', updateParams);
resetBtn.addEventListener('click', resetSimulation);

function drawCoordinateSystem() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 暗色网格
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    
    for (let x = originX; x < canvas.width; x += scale * 5) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }
    for (let y = originY; y > 0; y -= scale * 5) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }

    // 坐标轴
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1.5;

    // X 轴
    ctx.beginPath();
    ctx.moveTo(30, originY);
    ctx.lineTo(canvas.width - 20, originY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(canvas.width - 30, originY - 5);
    ctx.lineTo(canvas.width - 20, originY);
    ctx.lineTo(canvas.width - 30, originY + 5);
    ctx.fillStyle = '#cbd5e1';
    ctx.fill();

    // Y 轴
    ctx.beginPath();
    ctx.moveTo(originX, canvas.height - 20);
    ctx.lineTo(originX, 20);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(originX - 5, 30);
    ctx.lineTo(originX, 20);
    ctx.lineTo(originX + 5, 30);
    ctx.fill();

    // 刻度与标签
    ctx.fillStyle = '#f8fafc';
    ctx.font = '12px "Cambria Math", "Times New Roman", serif';
    ctx.fillText('x / m', canvas.width - 45, originY + 25);
    ctx.fillText('y / m', originX - 35, 30);

    for (let m = 10; m * scale < canvas.width - originX; m += 10) {
        let px = originX + m * scale;
        ctx.beginPath();
        ctx.moveTo(px, originY);
        ctx.lineTo(px, originY - 5);
        ctx.stroke();
        ctx.fillText(m, px - 6, originY + 16);
    }

    for (let m = 5; m * scale < originY; m += 5) {
        let py = originY - m * scale;
        ctx.beginPath();
        ctx.moveTo(originX, py);
        ctx.lineTo(originX + 5, py);
        ctx.stroke();
        ctx.fillText(m, originX - 22, py + 4);
    }

    ctx.fillText('O', originX - 14, originY + 16);
}

function drawLauncher() {
    ctx.save();
    ctx.translate(originX, originY);
    
    ctx.fillStyle = '#475569';
    ctx.fillRect(-10, -5, 20, 10);
    ctx.strokeStyle = '#94a3b8';
    ctx.strokeRect(-10, -5, 20, 10);

    ctx.rotate(-theta);
    ctx.fillStyle = '#64748b';
    ctx.fillRect(0, -4, 25, 8);
    ctx.strokeRect(0, -4, 25, 8);
    ctx.restore();

    ctx.beginPath();
    ctx.arc(originX, originY, 35, 0, -theta, true);
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    ctx.fillStyle = '#cbd5e1';
    ctx.font = 'italic 14px "Cambria Math", "Times New Roman", serif';
    ctx.fillText('θ', originX + 40, originY - 15);
}

// 绘制支持下标的学术矢量
function drawAcademicVector(p1, p2, color, labelBase, labelSub) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    let angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
    let headLen = 12;
    let headAngle = Math.PI / 8;
    
    ctx.beginPath();
    ctx.moveTo(p2.x, p2.y);
    ctx.lineTo(p2.x - headLen * Math.cos(angle - headAngle), p2.y - headLen * Math.sin(angle - headAngle));
    ctx.lineTo(p2.x - headLen * Math.cos(angle + headAngle), p2.y - headLen * Math.sin(angle + headAngle));
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    
    // 渲染带下标的文本
    let midX = (p1.x + p2.x) / 2;
    let midY = (p1.y + p2.y) / 2 - 8;
    
    ctx.font = 'italic 14px "Cambria Math", "Times New Roman", serif';
    let w1 = ctx.measureText(labelBase).width;
    ctx.font = 'italic 10px "Cambria Math", "Times New Roman", serif';
    let w2 = ctx.measureText(labelSub).width;
    let totalWidth = w1 + w2;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(midX - 2, midY - 12, totalWidth + 4, 18);
    
    ctx.fillStyle = color;
    ctx.font = 'italic 15px "Cambria Math", "Times New Roman", serif';
    ctx.fillText(labelBase, midX, midY);
    
    ctx.font = 'italic 10px "Cambria Math", "Times New Roman", serif';
    ctx.fillText(labelSub, midX + w1 + 1, midY + 4);
    
    ctx.restore();
}

let lastTime = 0;

function animate(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = timestamp;

    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        particles.push(new WaterParticle(v0, theta));
    }

    drawCoordinateSystem();
    drawLauncher();

    let v_x = v0 * Math.cos(theta);
    let v_y = v0 * Math.sin(theta);
    let totalTime = (2 * v_y) / g;
    let maxX = v_x * totalTime;
    let maxY = (v_y * v_y) / (2 * g);

    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    
    let steps = 100;
    for (let i = 0; i <= steps; i++) {
        let t = (i / steps) * totalTime;
        let x = v_x * t;
        let y = v_y * t - 0.5 * g * t * t;
        let px = originX + x * scale;
        let py = originY - y * scale;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    let tA = totalTime * 0.25; 
    let tB = totalTime * 0.50;
    let tC = totalTime * 0.75; 

    function getPointAtTime(t) {
        let x = v_x * t;
        let y = v_y * t - 0.5 * g * t * t;
        return { x: originX + x * scale, y: originY - y * scale };
    }

    let pA = getPointAtTime(tA);
    let pB = getPointAtTime(tB);
    let pC = getPointAtTime(tC);

    // 位移用 x 表示，配合深色模式的高对比学术配色
    drawAcademicVector(originX, originY, pA.x, pA.y, '#64748b', 'x', 'A'); 
    drawAcademicVector(pA, pB, '#f87171', 'x', 'AB'); 
    drawAcademicVector(pA, pC, '#34d399', 'x', 'AC'); 

    const pts = [
        { p: pA, name: 'A' },
        { p: pB, name: 'B' },
        { p: pC, name: 'C' }
    ];
    
    ctx.save();
    pts.forEach(item => {
        ctx.beginPath();
        ctx.arc(item.p.x, item.p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        
        ctx.fillStyle = '#ffffff';
        ctx.font = 'italic 16px "Cambria Math", "Times New Roman", serif';
        ctx.fillText(item.name, item.p.x - 5, item.p.y - 10);
    });
    ctx.restore();

    rangeVal.innerText = maxX.toFixed(2) + ' m';
    heightVal.innerText = maxY.toFixed(2) + ' m';
    timeVal.innerText = totalTime.toFixed(2) + ' s';

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        particles[i].draw(ctx);

        if (particles[i].y < 0 || particles[i].life > particles[i].maxLife || (originX + particles[i].x * scale) > canvas.width) {
            particles.splice(i, 1);
        }
    }

    requestAnimationFrame(animate);
}

resetSimulation();
requestAnimationFrame(animate);
</script>

</body>
</html>
