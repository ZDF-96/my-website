<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简物理：曲线运动与切线速度</title>
<style>
    :root {
        /* 高级冷灰/黑配色系统 (Zinc色系) */
        --bg: #09090B;          
        --grid: #18181B;
        --surface: rgba(24, 24, 27, 0.75); 
        --border: #27272A;      
        
        /* 物理要素高亮色 */
        --cyan: #06B6D4;        /* 速度矢量 */
        --purple: #A855F7;      /* 几何切线 */
        --green: #10B981;       /* 径向连线 */
        --amber: #F59E0B;       /* 目标与得分 */
        
        --text-main: #FAFAFA;
        --text-dim: #A1A1AA;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body { 
        width: 100%; height: 100%; overflow: hidden; 
        background-color: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    canvas { display: block; width: 100%; height: 100%; }

    /* ==========================================
       极简 UI 层
       ========================================== */
    .ui-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; display: flex; flex-direction: column; 
        justify-content: space-between; padding: 40px;
    }

    /* 顶部得分 */
    .score-container { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .score-label { font-size: 13px; color: var(--text-dim); letter-spacing: 6px; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; }
    .score-value { font-size: 72px; font-weight: 200; color: var(--text-main); line-height: 1; font-family: "SFMono-Regular", Consolas, monospace; }
    .score-value.hit { color: var(--amber); transform: scale(1.1); text-shadow: 0 0 24px rgba(245, 158, 11, 0.5); }
    .score-value { transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    /* 底部药丸控制台 */
    .bottom-console {
        align-self: center; background: var(--surface);
        border: 1px solid var(--border); border-radius: 100px;
        padding: 12px 28px; display: flex; gap: 32px; align-items: center;
        backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        pointer-events: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    }

    /* 轨道选择 */
    .track-selector { display: flex; gap: 6px; border-right: 1px solid var(--border); padding-right: 32px; }
    .track-btn {
        background: transparent; border: none; color: var(--text-dim);
        font-size: 14px; font-weight: 500; cursor: pointer; padding: 8px 18px;
        border-radius: 100px; transition: 0.2s ease;
    }
    .track-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
    .track-btn.active { background: #FAFAFA; color: #09090B; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    /* 速率调节滑块 */
    .speed-control { display: flex; align-items: center; gap: 12px; border-right: 1px solid var(--border); padding-right: 32px; }
    .speed-label { font-size: 13px; font-weight: 600; color: var(--text-dim); letter-spacing: 1px; }
    .range-slider {
        -webkit-appearance: none; width: 100px; height: 4px; border-radius: 2px;
        background: #3F3F46; outline: none; transition: 0.2s; cursor: pointer;
    }
    .range-slider::-webkit-slider-thumb {
        -webkit-appearance: none; width: 14px; height: 14px;
        border-radius: 50%; background: var(--text-main); cursor: grab;
        transition: 0.2s; box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .range-slider::-webkit-slider-thumb:active { transform: scale(1.2); cursor: grabbing; }

    /* 开关组 */
    .toggles { display: flex; gap: 24px; }
    .toggle-item { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .toggle-label { font-size: 14px; font-weight: 500; color: var(--text-dim); transition: 0.2s; }
    .toggle-item:hover .toggle-label { color: var(--text-main); }
    
    .switch { position: relative; width: 36px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #3F3F46; border-radius: 20px; transition: 0.3s; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: #FFF; border-radius: 50%; transition: 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); }
    input:checked + .slider.c-cyan { background: var(--cyan); }
    input:checked + .slider.c-purple { background: var(--purple); }
    input:checked + .slider.c-green { background: var(--green); }
    input:checked + .slider:before { transform: translateX(16px); }

    /* 操作提示 */
    .hint { position: absolute; bottom: 120px; width: 100%; text-align: center; color: var(--text-dim); font-size: 14px; letter-spacing: 2px; }
    .hint kbd { background: #27272A; padding: 4px 10px; border-radius: 6px; font-family: monospace; color: #FFF; margin: 0 6px; border: 1px solid #3F3F46; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="ui-layer">
    <div class="score-container">
        <div class="score-label">Successful Hits</div>
        <div class="score-value" id="scoreEl">0</div>
    </div>

    <div class="hint">按 <kbd>SPACE</kbd> 或点击屏幕释放</div>

    <div class="bottom-console">
        <!-- 1. 轨道切换 -->
        <div class="track-selector">
            <button class="track-btn active" data-track="circle">圆周</button>
            <button class="track-btn" data-track="ellipse">椭圆</button>
            <button class="track-btn" data-track="figure8">8字形</button>
        </div>
        
        <!-- 2. 速率调节 (新增) -->
        <div class="speed-control">
            <span class="speed-label">速率</span>
            <input type="range" id="speedSlider" class="range-slider" min="0.4" max="2.0" step="0.1" value="1.0">
        </div>

        <!-- 3. 辅助线开关 -->
        <div class="toggles">
            <label class="toggle-item">
                <div class="switch"><input type="checkbox" id="showTan" checked><div class="slider c-purple"></div></div>
                <span class="toggle-label" style="color:var(--purple)">切线</span>
            </label>
            <label class="toggle-item">
                <div class="switch"><input type="checkbox" id="showV" checked><div class="slider c-cyan"></div></div>
                <span class="toggle-label" style="color:var(--cyan)">速度</span>
            </label>
            <label class="toggle-item">
                <div class="switch"><input type="checkbox" id="showRad"><div class="slider c-green"></div></div>
                <span class="toggle-label">径向</span>
            </label>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreEl');
const speedSlider = document.getElementById('speedSlider');

const ui = {
    v: document.getElementById('showV'),
    tan: document.getElementById('showTan'),
    rad: document.getElementById('showRad')
};

let W, H, cx, cy, dpr;
let score = 0;
let time = 0;      // 物理积分时间
let lastTime = 0;
let speedScale = 1.0; // 速率乘子

// 核心实体常量
const LAUNCHER_R = 7;
const PROJECTILE_R = 4.5;
const TARGET_R = 20;

let currentTrack = 'circle';
let target = { x: -1000, y: -1000, active: false, scale: 0 };

// 引擎容器
let projectiles = []; 
let particles = [];
let ripples = [];

// ==========================================
// 核心轨道方程 (基础参数保持恒定)
// ==========================================
const OMEGA = 1.2; 
const Tracks = {
    circle: {
        getPos: (t) => ({ x: cx + 220 * Math.cos(OMEGA*t), y: cy + 220 * Math.sin(OMEGA*t) }),
        getVel: (t) => ({ x: -220 * OMEGA * Math.sin(OMEGA*t), y: 220 * OMEGA * Math.cos(OMEGA*t) })
    },
    ellipse: {
        getPos: (t) => ({ x: cx + 340 * Math.cos(OMEGA*t), y: cy + 160 * Math.sin(OMEGA*t) }),
        getVel: (t) => ({ x: -340 * OMEGA * Math.sin(OMEGA*t), y: 160 * OMEGA * Math.cos(OMEGA*t) })
    },
    figure8: {
        getPos: (t) => ({ x: cx + 340 * Math.sin(OMEGA*t*0.5), y: cy + 180 * Math.sin(OMEGA*t) }),
        getVel: (t) => ({ x: 340 * OMEGA*0.5 * Math.cos(OMEGA*t*0.5), y: 180 * OMEGA * Math.cos(OMEGA*t) })
    }
};

// ==========================================
// 系统初始化
// ==========================================
function resize() {
    W = window.innerWidth; 
    H = window.innerHeight;
    dpr = window.devicePixelRatio || 1;
    
    canvas.width = W * dpr; 
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); 
    cx = W / 2; cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// ==========================================
// 空间系暗网格渲染 (增加质感)
// ==========================================
function drawGrid() {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const step = 50;
    for (let x = cx % step; x < W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = cy % step; y < H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
}

// ==========================================
// 游戏逻辑：生成、发射、击中
// ==========================================
function spawnTarget() {
    const track = Tracks[currentTrack];
    const futureT = Math.random() * Math.PI * 4; 
    const p = track.getPos(futureT);
    const v = track.getVel(futureT);
    
    const vMag = Math.hypot(v.x, v.y);
    const distance = 250 + Math.random() * 150;
    
    let tx = p.x + (v.x / vMag) * distance;
    let ty = p.y + (v.y / vMag) * distance;
    
    const pad = 120;
    tx = Math.max(pad, Math.min(W - pad, tx));
    ty = Math.max(pad, Math.min(H - pad, ty));
    
    target = { x: tx, y: ty, active: true, scale: 0 };
}

function shoot() {
    const track = Tracks[currentTrack];
    const p = track.getPos(time);
    const v = track.getVel(time);
    
    const flySpeed = 800; // 统一脱离轨道后的初速
    const vMag = Math.hypot(v.x, v.y);
    
    projectiles.push({
        x: p.x, y: p.y,
        vx: (v.x / vMag) * flySpeed,
        vy: (v.y / vMag) * flySpeed,
        trail: [] 
    });
    
    createRipple(p.x, p.y, '#FAFAFA', 30);
}

function hitTarget(x, y) {
    score++;
    scoreEl.textContent = score;
    scoreEl.classList.add('hit');
    setTimeout(() => scoreEl.classList.remove('hit'), 200);
    
    createRipple(x, y, '#F59E0B', 80);
    createSparks(x, y); // 物理火花
    
    target.active = false;
    spawnTarget(); // 瞬间刷新
}

// 特效：涟漪与火花细线
function createRipple(x, y, color, maxRadius) {
    ripples.push({ x, y, r: 0, maxR: maxRadius, color, alpha: 1 });
}

function createSparks(x, y) {
    for(let i=0; i<20; i++) {
        const ang = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 8;
        particles.push({
            x, y, 
            vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed,
            life: 1.0, 
            len: 5 + Math.random()*15 // 火花拉伸长度
        });
    }
}

// ==========================================
// 极简绘图工具
// ==========================================
function drawArrow(fx, fy, vx, vy, color) {
    const tx = fx + vx;
    const ty = fy + vy;
    const angle = Math.atan2(vy, vx);
    const headlen = 10;
    
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(tx, ty);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - headlen*Math.cos(angle-0.5), ty - headlen*Math.sin(angle-0.5));
    ctx.lineTo(tx - headlen*Math.cos(angle+0.5), ty - headlen*Math.sin(angle+0.5));
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
}

// ==========================================
// 主渲染循环
// ==========================================
function animate(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.03); 
    lastTime = timestamp;
    
    // 同步速率滑块，计算新的时间流逝
    speedScale = parseFloat(speedSlider.value);
    time += dt * speedScale;

    // 清空背景并画网格
    ctx.fillStyle = '#09090B'; 
    ctx.fillRect(0, 0, W, H);
    drawGrid();

    const track = Tracks[currentTrack];

    // 1. 渲染轨道基准线
    ctx.beginPath();
    ctx.strokeStyle = '#27272A';
    ctx.lineWidth = 2;
    for(let i=0; i<=200; i++) {
        const t = (i/200) * Math.PI * 4;
        const p = track.getPos(t);
        if(i===0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();

    // 2. 渲染空间涟漪
    for(let i=ripples.length-1; i>=0; i--) {
        let r = ripples[i];
        r.r += dt * 250;
        r.alpha -= dt * 3;
        if(r.alpha <= 0) { ripples.splice(i, 1); continue; }
        
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
        ctx.strokeStyle = r.color; ctx.globalAlpha = r.alpha;
        ctx.lineWidth = 1.5; ctx.stroke(); ctx.globalAlpha = 1;
    }

    // 3. 渲染目标靶机 (极简呼吸环)
    if (target.active) {
        if (target.scale < 1) target.scale += dt * 6;
        const pulse = 1 + Math.sin(timestamp / 200) * 0.05;
        const currentR = TARGET_R * target.scale * pulse;
        
        ctx.beginPath(); ctx.arc(target.x, target.y, currentR, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(245, 158, 11, 0.1)'; ctx.fill();
        ctx.strokeStyle = '#F59E0B'; ctx.lineWidth = 2; ctx.stroke();
        
        ctx.beginPath(); ctx.arc(target.x, target.y, 3, 0, Math.PI*2);
        ctx.fillStyle = '#F59E0B'; ctx.fill();
    }

    // 4. 获取母星物理状态
    const launcherPos = track.getPos(time);
    const launcherVel = track.getVel(time); // 原生速度矢量
    const heading = Math.atan2(launcherVel.y, launcherVel.x);

    // 5. 渲染辅助线
    const inf = Math.max(W, H);
    
    // 切线
    if (ui.tan.checked) {
        ctx.beginPath();
        ctx.moveTo(launcherPos.x - Math.cos(heading)*inf, launcherPos.y - Math.sin(heading)*inf);
        ctx.lineTo(launcherPos.x + Math.cos(heading)*inf, launcherPos.y + Math.sin(heading)*inf);
        ctx.strokeStyle = 'rgba(168, 85, 247, 0.4)'; ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
    }
    
    // 径向
    if (ui.rad.checked && currentTrack !== 'figure8') {
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(launcherPos.x, launcherPos.y);
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)'; ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
    }

    // 速度矢量 (核心亮点：箭头长度随速率滑块实时伸缩)
    if (ui.v.checked) {
        // 归一化后，乘以一个基础显示长度 (80)，再乘以当前的速率调节系数
        const baseDisplayLen = 80; 
        const vMag = Math.hypot(launcherVel.x, launcherVel.y);
        const displayVx = (launcherVel.x / vMag) * baseDisplayLen * speedScale;
        const displayVy = (launcherVel.y / vMag) * baseDisplayLen * speedScale;
        
        drawArrow(launcherPos.x, launcherPos.y, displayVx, displayVy, '#06B6D4');
    }

    // 6. 渲染子星与优雅拖尾
    for(let i=projectiles.length-1; i>=0; i--) {
        let p = projectiles[i];
        
        p.trail.push({x: p.x, y: p.y});
        if(p.trail.length > 12) p.trail.shift();
        
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        
        // 优雅透明度渐变拖尾
        if (p.trail.length > 1) {
            ctx.lineCap = 'round';
            for(let j=0; j<p.trail.length-1; j++) {
                ctx.beginPath();
                ctx.moveTo(p.trail[j].x, p.trail[j].y);
                ctx.lineTo(p.trail[j+1].x, p.trail[j+1].y);
                const alpha = (j / p.trail.length) * 0.6; 
                ctx.strokeStyle = `rgba(250, 250, 250, ${alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        ctx.fillStyle = '#FAFAFA';
        ctx.beginPath(); ctx.arc(p.x, p.y, PROJECTILE_R, 0, Math.PI*2); ctx.fill();

        // 碰撞
        const dist = Math.hypot(p.x - target.x, p.y - target.y);
        if (target.active && dist < PROJECTILE_R + TARGET_R) {
            hitTarget(target.x, target.y);
            projectiles.splice(i, 1);
            continue;
        }
        if (p.x < -100 || p.x > W+100 || p.y < -100 || p.y > H+100) { projectiles.splice(i, 1); }
    }

    // 7. 渲染母星 (极简环形设计)
    ctx.fillStyle = '#FAFAFA';
    ctx.beginPath(); ctx.arc(launcherPos.x, launcherPos.y, LAUNCHER_R, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#09090B'; ctx.lineWidth = 3; ctx.stroke(); 
    ctx.strokeStyle = '#3F3F46'; ctx.lineWidth = 1; ctx.stroke(); 

    // 8. 渲染物理火花细线 (更高级的爆炸效果)
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        p.x += p.vx * dt * 60; 
        p.y += p.vy * dt * 60;
        
        // 画出带有运动模糊的细线
        ctx.lineTo(p.x - p.vx*p.len*dt, p.y - p.vy*p.len*dt); 
        
        p.life -= dt * 2.5;
        if(p.life <= 0) {
            particles.splice(i, 1);
        } else {
            ctx.globalAlpha = p.life;
            ctx.strokeStyle = '#F59E0B';
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }
    }

    requestAnimationFrame(animate);
}

// ==========================================
// 交互事件绑定
// ==========================================
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); shoot(); }
});
canvas.addEventListener('mousedown', shoot);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); }, {passive: false});

// 轨道切换
document.querySelectorAll('.track-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('.track-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentTrack = e.target.getAttribute('data-track');
        spawnTarget(); 
    });
});

// 速率调节栏不触发射击
speedSlider.addEventListener('mousedown', (e) => e.stopPropagation());
speedSlider.addEventListener('touchstart', (e) => e.stopPropagation(), {passive:false});

// 启动
spawnTarget();
requestAnimationFrame(animate);
</script>
</body>
</html>
