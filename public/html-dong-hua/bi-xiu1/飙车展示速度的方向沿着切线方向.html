<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曲线运动：速度与切线的关系</title>
<style>
:root {
    --bg: #020617;
    --panel: rgba(15, 23, 42, 0.85);
    --border: rgba(148, 163, 184, 0.15);
    --text: #f8fafc;
    --muted: #94a3b8;
    --cyan: #06b6d4;      /* 速度矢量 */
    --tangent: #cbd5e1;   /* 几何切线 */
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
html, body { width: 100%; height: 100%; }

body {
    background: radial-gradient(circle at 50% -10%, #1e293b 0%, var(--bg) 80%);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
}

.main {
    width: min(1200px, 95vw);
    height: min(800px, 90vh);
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px; padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(20px);
}

.stage {
    position: relative;
    border-radius: 12px;
    background: #05080f;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: inset 0 0 80px #000;
    overflow: hidden;
}

canvas { width: 100%; height: 100%; display: block; }

.scene-title { position: absolute; top: 20px; left: 20px; pointer-events: none; }
.scene-title h2 { font-size: 1.25rem; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.8); color: var(--cyan); }
.scene-title p { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }

.sidebar { display: flex; flex-direction: column; gap: 16px; }

.panel {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 18px;
}
.panel-title { 
    font-size: 0.95rem; font-weight: 600; border-bottom: 1px dashed rgba(255,255,255,0.1); 
    padding-bottom: 10px; margin-bottom: 16px; color: #e2e8f0;
}

.toggle-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; font-size: 0.9rem; color: #cbd5e1;
}
.toggle-row:last-child { margin-bottom: 0; }

.switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(255,255,255,0.1); border-radius: 24px; transition: .3s;
}
.slider:before {
    position: absolute; content: ""; height: 18px; width: 18px;
    left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .3s;
}
input:checked + .slider.v-color { background-color: var(--cyan); box-shadow: 0 0 10px rgba(6,182,212,0.4); }
input:checked + .slider.t-color { background-color: #64748b; }
input:checked + .slider:before { transform: translateX(20px); }

/* 滑动条样式 */
.range-slider {
    width: 100%;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.1);
    height: 6px;
    border-radius: 3px;
    outline: none;
    margin-top: 10px;
}
.range-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--cyan);
    cursor: pointer;
    box-shadow: 0 0 10px var(--cyan);
}

.instruction { font-size: 0.9rem; color: var(--muted); line-height: 1.8; }
.instruction strong { color: #f8fafc; }
.instruction .hl-cyan { color: var(--cyan); font-weight: bold; }

.btn-play {
    width: 100%; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 600;
    cursor: pointer; background: rgba(6, 182, 212, 0.15); color: var(--cyan);
    border: 1px solid rgba(6, 182, 212, 0.4); transition: 0.2s; font-family: inherit;
    margin-top: 10px;
}
.btn-play:hover { background: rgba(6, 182, 212, 0.25); box-shadow: 0 0 15px rgba(6, 182, 212, 0.2); }
</style>
</head>
<body>

<div class="main">
    <div class="stage">
        <canvas id="simCanvas"></canvas>
        <div class="scene-title">
            <h2>曲线运动的本质</h2>
            <p>观察点：速度矢量永远落在几何切线上，不随曲率改变而偏移</p>
        </div>
    </div>

    <div class="sidebar">
        <div class="panel">
            <div class="panel-title">观察工具</div>
            <div class="toggle-row">
                <span>显示 几何切线 (辅助线)</span>
                <label class="switch">
                    <input type="checkbox" id="showTangent" checked>
                    <span class="slider t-color"></span>
                </label>
            </div>
            <div class="toggle-row">
                <span>显示 瞬时速度 (v)</span>
                <label class="switch">
                    <input type="checkbox" id="showV" checked>
                    <span class="slider v-color"></span>
                </label>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">行驶状态控制</div>
            <div style="font-size: 0.9rem; color: #cbd5e1; margin-bottom: 5px;">
                调整车速 (感受速度矢量长度变化)
            </div>
            <input type="range" id="speedSlider" class="range-slider" min="0.5" max="2.5" step="0.1" value="1.2">
            
            <button class="btn-play" id="playBtn">暂停动画</button>
        </div>

        <div class="panel" style="flex-grow: 1;">
            <div class="panel-title">物理规律解析</div>
            <div class="instruction">
                1. <strong>切线的定义：</strong>在曲线的某一点，与曲线“刚好擦过”的那条直线。<br><br>
                2. <strong>速度的方向：</strong>做曲线运动的物体，在任何一个时刻的瞬时速度方向，都严格沿着轨迹在该点的<span class="hl-cyan">切线方向</span>。<br><br>
                3. <strong>直观验证：</strong>无论车速快慢（矢量变长变短），蓝色的速度箭头始终严丝合缝地贴合在灰白色的几何切线上。
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const chkTangent = document.getElementById('showTangent');
    const chkV = document.getElementById('showV');
    const speedSlider = document.getElementById('speedSlider');
    const playBtn = document.getElementById('playBtn');
    
    let W, H, cx, cy;
    let time = 0;
    let isPlaying = true;
    let lastTime = 0;
    
    // Resize Handler
    function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        W = rect.width; H = rect.height;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx.scale(dpr, dpr);
        cx = W / 2; cy = H / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // 采用复杂的连续弯道(利萨如曲线变形)，让切线方向的变化更加丰富
    const Track = {
        getPos: (t) => ({ 
            x: cx + 320 * Math.sin(t), 
            y: cy + 180 * Math.sin(2 * t) 
        }),
        getVel: (t) => ({ 
            x: 320 * Math.cos(t), 
            y: 360 * Math.cos(2 * t) 
        })
    };

    // 画赛道底图
    function drawTrack() {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 36; // 宽阔的赛道
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        const steps = 200;
        const T = Math.PI * 2;
        
        for(let i = 0; i <= steps; i++) {
            const t = (i / steps) * T;
            const p = Track.getPos(t);
            if(i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        
        // 赛道中心虚线
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([15, 20]);
        for(let i = 0; i <= steps; i++) {
            const t = (i / steps) * T;
            const p = Track.getPos(t);
            if(i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // 画几何切线 (贯穿整个屏幕的无限长虚线)
    function drawTangentLine(x, y, angle) {
        const lineLen = Math.max(W, H); // 足够长，超出屏幕
        const p1x = x - Math.cos(angle) * lineLen;
        const p1y = y - Math.sin(angle) * lineLen;
        const p2x = x + Math.cos(angle) * lineLen;
        const p2y = y + Math.sin(angle) * lineLen;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(p1x, p1y);
        ctx.lineTo(p2x, p2y);
        ctx.strokeStyle = 'rgba(203, 213, 225, 0.4)'; // 灰白色
        ctx.lineWidth = 1.5;
        ctx.setLineDash([8, 8]);
        ctx.stroke();
        
        // 标注 "切线" 两个字
        ctx.translate(x - Math.cos(angle)*150, y - Math.sin(angle)*150);
        ctx.rotate(angle);
        ctx.fillStyle = 'rgba(203, 213, 225, 0.8)';
        ctx.font = '14px sans-serif';
        ctx.fillText('几何切线', 0, -8);
        ctx.restore();
    }

    // 画速度矢量箭头
    function drawVelocityArrow(fx, fy, vx, vy) {
        const headlen = 12;
        const tx = fx + vx;
        const ty = fy + vy;
        const angle = Math.atan2(vy, vx);
        
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.lineTo(tx, ty);
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 4;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx - headlen * Math.cos(angle - Math.PI/6), ty - headlen * Math.sin(angle - Math.PI/6));
        ctx.lineTo(tx - headlen * Math.cos(angle + Math.PI/6), ty - headlen * Math.sin(angle + Math.PI/6));
        ctx.closePath();
        ctx.fillStyle = '#06b6d4';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#06b6d4';
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // 字母 v
        ctx.fillStyle = '#06b6d4';
        ctx.font = 'italic 18px "Cambria Math", serif';
        ctx.fillText('v', tx + 10, ty + 10);
    }

    // 绘制俯视摩托车
    function drawMotorcycle(x, y, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        
        // 车身主体
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(-18, -9, 36, 18, 5);
        ctx.fill();
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // 轮胎
        ctx.fillStyle = '#020617';
        ctx.fillRect(14, -4, 10, 8); // 前轮
        ctx.fillRect(-24, -4, 12, 8); // 后轮
        
        // 骑手头盔
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(-2, 0, 6.5, 0, Math.PI*2);
        ctx.fill();
        
        // 车头灯光束
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.beginPath();
        ctx.moveTo(22, 0);
        ctx.lineTo(80, -20);
        ctx.lineTo(80, 20);
        ctx.closePath();
        ctx.fill();
        
        ctx.restore();
    }

    function animate(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        
        if (isPlaying) {
            const speedMultiplier = parseFloat(speedSlider.value);
            time += dt * speedMultiplier * 0.5; // 整体运动时间累加
        }
        
        ctx.clearRect(0, 0, W, H);
        
        // 1. 绘制底层赛道
        drawTrack();
        
        // 2. 计算当前物理状态
        const pos = Track.getPos(time);
        const vel = Track.getVel(time);
        
        // 计算速度方向角 (切线角)
        const heading = Math.atan2(vel.y, vel.x);
        
        // 3. 画几何切线 (作为物理矢量的对照组)
        if (chkTangent.checked) {
            drawTangentLine(pos.x, pos.y, heading);
        }
        
        // 4. 绘制摩托车实体
        drawMotorcycle(pos.x, pos.y, heading);
        
        // 5. 绘制速度矢量 (根据 UI 滑块动态缩放长度，让学生看到“大小变了但方向依旧相切”)
        if (chkV.checked) {
            const displayVScale = parseFloat(speedSlider.value) * 0.3; // 放大比例，仅为了视觉展示
            drawVelocityArrow(pos.x, pos.y, vel.x * displayVScale, vel.y * displayVScale);
        }
        
        requestAnimationFrame(animate);
    }

    // 播放/暂停控制
    playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playBtn.textContent = isPlaying ? "暂停动画" : "继续行驶";
    });

    // 启动动画
    requestAnimationFrame(animate);
})();
</script>
</body>
</html>
