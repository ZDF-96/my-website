<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v-t 图像与 1D 运动学同步追踪 (防遮挡高颜值版)</title>

<style>
:root {
    --bg: #020617;
    --panel: rgba(15, 23, 42, 0.85);
    --border: rgba(148, 163, 184, 0.15);

    --text: #f8fafc;
    --muted: #94a3b8;

    --cyan: #06b6d4;      /* 速度 v */
    --yellow: #f59e0b;    /* 加速度 a */
    --purple: #d946ef;    /* 正向位移 */
    --red: #ef4444;       /* 负向位移 */
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
html, body { width: 100%; height: 100%; }

body {
    background: radial-gradient(circle at 50% -10%, #0f172a 0%, var(--bg) 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}

.main {
    width: min(1500px, 96vw);
    height: min(880px, 95vh);
    display: grid;
    grid-template-columns: minmax(680px, 1fr) 420px;
    gap: 22px; padding: 22px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 35px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.1);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
}

/* =========================================================
   左侧：全景坐标舞台
========================================================= */
.stage {
    display: flex; flex-direction: column;
    border-radius: 12px; background: #02040a;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
    overflow: hidden;
}

.vt-container { flex: 1; position: relative; min-height: 0; }
.motion-container {
    height: 210px;
    position: relative;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.2) 0%, rgba(2, 6, 23, 0.6) 100%);
}

canvas { width: 100%; height: 100%; display: block; }

.scene-title { position: absolute; top: 24px; left: 24px; pointer-events: none; }
.scene-title h2 { font-size: 1.3rem; font-weight: 600; color: #f8fafc; letter-spacing: 0.5px; }
.scene-title p { margin-top: 6px; font-size: 0.85rem; color: var(--muted); }

/* =========================================================
   右侧面板
========================================================= */
.sidebar { overflow-y: auto; padding-right: 6px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.1) transparent; }
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }

.header { padding: 0 4px 18px; }
.header h1 { font-size: 1.35rem; color: #fff; border-left: 4px solid var(--cyan); padding-left: 14px; line-height: 1.35; }

.panel { padding: 18px 20px; margin-bottom: 16px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
.panel-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.95rem; font-weight: 600; color: #e2e8f0; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); padding-bottom: 10px; }

.sub-title { font-size: 0.8rem; color: #94a3b8; margin: 12px 0 8px 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.sub-title:first-of-type { margin-top: 0; }

.btn-group { display: flex; flex-direction: column; gap: 8px; }
.motion-btn { padding: 12px 14px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; color: var(--text); cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem; font-family: inherit; }
.motion-btn span:last-child { color: var(--muted); font-family: "Cambria Math", serif; font-size: 0.82rem; }
.motion-btn:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-1px); }
.motion-btn.active { background: rgba(217, 70, 239, 0.12); border-color: rgba(217, 70, 239, 0.4); box-shadow: inset 4px 0 0 var(--purple); }
.motion-btn.special:hover { background: rgba(245, 158, 11, 0.1); }
.motion-btn.special.active { background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.5); box-shadow: inset 4px 0 0 var(--yellow); }

.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.action-btn { padding: 12px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.2s; border: 1px solid transparent; letter-spacing: 0.5px; }
.btn-play { background: rgba(6, 182, 212, 0.15); color: var(--cyan); border-color: rgba(6, 182, 212, 0.4); }
.btn-play:hover { background: rgba(6, 182, 212, 0.25); box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); }
.btn-reset { background: rgba(255, 255, 255, 0.05); color: var(--text); border-color: rgba(255, 255, 255, 0.1); }
.btn-reset:hover { background: rgba(255, 255, 255, 0.12); }

.data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.data-item { display: flex; flex-direction: column; gap: 6px; background: rgba(0, 0, 0, 0.25); padding: 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.03); }
.data-label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;}
.data-value { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; font-weight: 600; font-size: 1.1rem; }
.val-v { color: var(--cyan); text-shadow: 0 0 12px rgba(6, 182, 212, 0.3); }
.val-a { color: var(--yellow); text-shadow: 0 0 12px rgba(245, 158, 11, 0.3); }
.val-x { color: var(--purple); text-shadow: 0 0 12px rgba(217, 70, 239, 0.3); }
</style>
</head>
<body>

<div class="main">
    <div class="stage">
        <!-- 上层：v-t 图像 -->
        <div class="vt-container">
            <canvas id="vtCanvas"></canvas>
            <div class="scene-title">
                <h2>v-t 图像进阶分析</h2>
                <p>切线斜率 (Δv/Δt) 与正负位移积分</p>
            </div>
        </div>
        <!-- 下层：学术级 1D 滑块模拟 -->
        <div class="motion-container">
            <canvas id="motionCanvas"></canvas>
        </div>
    </div>

    <div class="sidebar">
        <div class="header">
            <h1>图形几何与物理运动</h1>
        </div>

        <div class="panel" style="padding-bottom: 12px;">
            <div class="panel-title"><span>① 运动学模型库</span></div>
            <div class="sub-title">基础运动与匀变速</div>
            <div class="btn-group">
                <button class="motion-btn" data-type="uniform" type="button">
                    <span>匀速直线（斜率为0）</span><span>a = 0</span>
                </button>
                <button class="motion-btn active" data-type="uniform_accel" type="button">
                    <span>匀加速（反向起步）</span><span>a > 0</span>
                </button>
                <button class="motion-btn" data-type="uniform_decel" type="button">
                    <span>匀减速（穿越原点）</span><span>a < 0</span>
                </button>
            </div>
            <div class="sub-title" style="margin-top: 14px;">变加速探究 (观察斜率三角)</div>
            <div class="btn-group">
                <button class="motion-btn special" data-type="accel_inc" type="button">
                    <span>加速度渐大（切线变陡）</span><span>v ∝ t²</span>
                </button>
                <button class="motion-btn special" data-type="accel_dec" type="button">
                    <span>加速度渐小（切线变平）</span><span>v ∝ 20t-t²</span>
                </button>
                <button class="motion-btn special" data-type="oscillation" type="button">
                    <span>简谐振动（往复运动）</span><span>a ∝ -x</span>
                </button>
            </div>
            <div class="controls">
                <button class="action-btn btn-play" id="playBtn" type="button">暂停 [Space]</button>
                <button class="action-btn btn-reset" id="resetBtn" type="button">重置 [R]</button>
            </div>
        </div>

        <div class="panel" style="margin-bottom:0;">
            <div class="panel-title"><span>② 实时微积分数据</span></div>
            <div class="data-grid">
                <div class="data-item">
                    <span class="data-label">时间戳 t</span>
                    <span class="data-value" id="val-t">0.00 s</span>
                </div>
                <div class="data-item">
                    <span class="data-label">净位移 x (或 ∫v dt)</span>
                    <span class="data-value val-x" id="val-x">0.0 m</span>
                </div>
                <div class="data-item">
                    <span class="data-label">瞬时速度 v</span>
                    <span class="data-value val-v" id="val-v">0.0 m/s</span>
                </div>
                <div class="data-item">
                    <span class="data-label">切线加速度 a</span>
                    <span class="data-value val-a" id="val-a">0.0 m/s²</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    /* ==========================================================
       0. 画布定义与系统变量
       ========================================================== */
    const vtCanvas = document.getElementById('vtCanvas');
    const vtCtx = vtCanvas.getContext('2d');
    const motionCanvas = document.getElementById('motionCanvas');
    const motionCtx = motionCanvas.getContext('2d');

    let vtW = 0, vtH = 0, mW = 0, mH = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    const MAX_TIME = 10;
    const MAX_V = 100;
    let originX = 60, originY = 0, xAxisLength = 0, yAxisLength = 0;

    // 1D 滑块轴线位置
    let motionAxisY = 0;
    const X_AXIS_MIN = -160; 
    const X_AXIS_MAX = 700;

    let currentMotion = 'uniform_accel';
    let time = 0;
    let playing = true;
    let lastTimestamp = 0;

    const valT = document.getElementById('val-t'), valV = document.getElementById('val-v'),
          valA = document.getElementById('val-a'), valX = document.getElementById('val-x'),
          playBtn = document.getElementById('playBtn'), resetBtn = document.getElementById('resetBtn');

    /* ==========================================================
       1. 运动学模型库
       ========================================================== */
    const MOTIONS = {
        uniform: { getV: (t) => 50, getA: () => 0, getX: (t) => 50 * t },
        uniform_accel: { getV: (t) => -60 + 15 * t, getA: () => 15, getX: (t) => -60 * t + 0.5 * 15 * t * t },
        uniform_decel: { getV: (t) => 70 - 14 * t, getA: () => -14, getX: (t) => 70 * t - 0.5 * 14 * t * t },
        accel_inc: { getV: (t) => t * t, getA: (t) => 2 * t, getX: (t) => (t * t * t) / 3 },
        accel_dec: { getV: (t) => 20 * t - t * t, getA: (t) => 20 - 2 * t, getX: (t) => 10 * t * t - (t * t * t) / 3 },
        oscillation: { getV: (t) => 80 * Math.cos((Math.PI / 5) * t), getA: (t) => -80 * (Math.PI / 5) * Math.sin((Math.PI / 5) * t), getX: (t) => (80 / (Math.PI / 5)) * Math.sin((Math.PI / 5) * t) },
    };

    /* ==========================================================
       2. UI 防遮挡渲染助手 (核心组件)
       ========================================================== */
    // 绘制带有暗色半透明底板的文字，彻底解决重叠遮挡
    function drawPillLabel(ctx, text, x, y, color, align = 'center') {
        ctx.save();
        ctx.font = 'bold 12px "Consolas", "Microsoft YaHei", sans-serif';
        const paddingX = 8;
        const paddingY = 4;
        const textWidth = ctx.measureText(text).width;
        
        let boxX = x;
        if (align === 'center') boxX = x - textWidth / 2 - paddingX;
        if (align === 'right') boxX = x - textWidth - paddingX * 2;
        if (align === 'left') boxX = x;

        // 绘制毛玻璃底板
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.beginPath();
        if(ctx.roundRect) {
            ctx.roundRect(boxX, y - 12 - paddingY, textWidth + paddingX * 2, 12 + paddingY * 2, 6);
        } else {
            ctx.rect(boxX, y - 12 - paddingY, textWidth + paddingX * 2, 12 + paddingY * 2);
        }
        ctx.fill();
        
        // 绘制文字
        ctx.fillStyle = color;
        ctx.textAlign = 'left';
        ctx.fillText(text, boxX + paddingX, y);
        ctx.restore();
    }

    /* ==========================================================
       3. 尺寸适配与映射
       ========================================================== */
    function resizeCanvas() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        const vtRect = vtCanvas.parentElement.getBoundingClientRect();
        vtW = vtRect.width; vtH = vtRect.height;
        vtCanvas.width = Math.round(vtW * dpr); vtCanvas.height = Math.round(vtH * dpr);
        vtCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        originX = Math.max(72, vtW * 0.08); 
        originY = vtH / 2 + 10; 
        xAxisLength = vtW - originX - 46; 
        yAxisLength = (vtH - 80) / 2;

        const mRect = motionCanvas.parentElement.getBoundingClientRect();
        mW = mRect.width; mH = mRect.height;
        motionCanvas.width = Math.round(mW * dpr); motionCanvas.height = Math.round(mH * dpr);
        motionCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        motionAxisY = mH / 2 + 5;
    }
    window.addEventListener('resize', resizeCanvas);

    const toVtX = (t) => originX + (t / MAX_TIME) * xAxisLength;
    const toVtY = (v) => originY - (v / MAX_V) * yAxisLength;
    // 滑块智能映射：两端留足 padding 防止出界
    const toMotionX = (x) => {
        const padding = 70, availableW = mW - padding * 2, scale = availableW / (X_AXIS_MAX - X_AXIS_MIN);
        return padding + (x - X_AXIS_MIN) * scale;
    };

    /* ==========================================================
       4. v-t 画布渲染
       ========================================================== */
    function drawVtStage(model, currV, currA) {
        vtCtx.clearRect(0, 0, vtW, vtH);
        const displayA = Math.abs(currA) < 0.05 ? 0 : currA;
        
        // 1. 坐标轴及背景网格
        vtCtx.save(); vtCtx.lineWidth = 1; vtCtx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
        for (let i = 1; i <= 10; i++) { const x = toVtX(i); vtCtx.beginPath(); vtCtx.moveTo(x, originY - yAxisLength); vtCtx.lineTo(x, originY + yAxisLength); vtCtx.stroke(); }
        for (let v = -100; v <= 100; v += 20) { if (v === 0) continue; const y = toVtY(v); vtCtx.beginPath(); vtCtx.moveTo(originX, y); vtCtx.lineTo(originX + xAxisLength, y); vtCtx.stroke(); }
        vtCtx.strokeStyle = 'rgba(255, 255, 255, 0.6)'; vtCtx.fillStyle = 'rgba(255, 255, 255, 0.6)'; vtCtx.lineWidth = 1.5;
        vtCtx.beginPath(); vtCtx.moveTo(originX, originY); vtCtx.lineTo(originX + xAxisLength + 20, originY); vtCtx.stroke();
        vtCtx.beginPath(); vtCtx.moveTo(originX, originY - yAxisLength - 20); vtCtx.lineTo(originX, originY + yAxisLength + 10); vtCtx.stroke();
        
        vtCtx.font = '12px Consolas'; vtCtx.fillStyle = 'rgba(255, 255, 255, 0.4)'; vtCtx.textAlign = 'center';
        for (let t = 2; t <= 10; t += 2) vtCtx.fillText(t, toVtX(t), originY + 18);
        vtCtx.textAlign = 'right';
        for (let v = -100; v <= 100; v += 20) { if (v === 0) continue; vtCtx.fillText(v > 0 ? `+${v}` : `${v}`, originX - 10, toVtY(v) + 4); }
        vtCtx.fillText('0', originX - 10, originY + 16);
        vtCtx.restore();

        // 2. 积分面积渲染
        if (time > 0) {
            const N = Math.max(30, Math.round(time / 0.02)); const samples = [];
            for (let i = 0; i <= N; i++) samples.push({ t: (time * i) / N, v: model.getV((time * i) / N) });
            vtCtx.save();
            vtCtx.beginPath(); vtCtx.moveTo(toVtX(0), originY);
            for (let s of samples) vtCtx.lineTo(toVtX(s.t), toVtY(Math.max(s.v, 0)));
            vtCtx.lineTo(toVtX(time), originY); vtCtx.fillStyle = 'rgba(217, 70, 239, 0.2)'; vtCtx.fill();
            
            vtCtx.beginPath(); vtCtx.moveTo(toVtX(0), originY);
            for (let s of samples) vtCtx.lineTo(toVtX(s.t), toVtY(Math.min(s.v, 0)));
            vtCtx.lineTo(toVtX(time), originY); vtCtx.fillStyle = 'rgba(239, 68, 68, 0.2)'; vtCtx.fill();
            
            // 发光运动曲线
            vtCtx.beginPath(); vtCtx.strokeStyle = '#06b6d4'; vtCtx.lineWidth = 3; vtCtx.shadowColor = '#06b6d4'; vtCtx.shadowBlur = 8;
            for (let s of samples) { if (s.t === 0) vtCtx.moveTo(toVtX(s.t), toVtY(s.v)); else vtCtx.lineTo(toVtX(s.t), toVtY(s.v)); }
            vtCtx.stroke(); vtCtx.restore();
        }

        const cx = toVtX(time), cy = toVtY(currV);

        // 3. 辅助十字准星
        vtCtx.save(); vtCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; vtCtx.lineWidth = 1; vtCtx.setLineDash([4, 4]);
        vtCtx.beginPath(); vtCtx.moveTo(cx, cy); vtCtx.lineTo(cx, originY); vtCtx.stroke();
        vtCtx.beginPath(); vtCtx.moveTo(cx, cy); vtCtx.lineTo(originX, cy); vtCtx.stroke(); vtCtx.restore();

        // 4. 加速度切线
        const v2 = currV + currA * 1.0;
        const dx = toVtX(time + 1.0) - cx;
        const dy = toVtY(v2) - cy;
        const angle = Math.atan2(dy, dx);
        const tangentLen = Math.max(60, vtW * 0.08);

        vtCtx.save(); 
        vtCtx.beginPath(); 
        vtCtx.moveTo(cx - Math.cos(angle) * tangentLen, cy - Math.sin(angle) * tangentLen);
        vtCtx.lineTo(cx + Math.cos(angle) * tangentLen, cy + Math.sin(angle) * tangentLen);
        vtCtx.strokeStyle = '#f59e0b'; vtCtx.lineWidth = 2; vtCtx.shadowColor = '#f59e0b'; vtCtx.shadowBlur = 8; 
        vtCtx.stroke(); 
        vtCtx.restore();

        // 5. 斜率三角 (Δv / Δt) 与 标签防遮挡渲染
        if (Math.abs(currA) > 0.05) {
            const dtPx = 50; 
            const dvPx = dtPx * Math.tan(angle); 
            
            vtCtx.save();
            vtCtx.strokeStyle = 'rgba(245, 158, 11, 0.6)';
            vtCtx.setLineDash([3, 3]); vtCtx.lineWidth = 1.5;
            vtCtx.beginPath(); vtCtx.moveTo(cx, cy); vtCtx.lineTo(cx + dtPx, cy); vtCtx.lineTo(cx + dtPx, cy + dvPx); vtCtx.stroke();
            vtCtx.restore();

            // 防遮挡标签: Δt 和 Δv
            drawPillLabel(vtCtx, 'Δt', cx + dtPx/2, cy + (dvPx > 0 ? -10 : 20), '#f59e0b', 'center');
            drawPillLabel(vtCtx, 'Δv', cx + dtPx + 15, cy + dvPx/2 + 4, '#f59e0b', 'left');
        }

        // 6. 智能定位切线斜率读数标签
        // 计算安全位置：如果曲线在上方，文字放下方；如果时间太靠右，文字左靠。
        let labelAlign = 'left';
        let textOffsetX = 15;
        let textOffsetY = (currA > 0 || (currA === 0 && currV > 0)) ? -18 : 28;
        if (time > 7.5) {
            labelAlign = 'right';
            textOffsetX = -15;
        }
        
        const aText = `斜率 a = ${displayA > 0 ? '+' : ''}${displayA.toFixed(1)} m/s²`;
        drawPillLabel(vtCtx, aText, cx + textOffsetX, cy + textOffsetY, '#f59e0b', labelAlign);

        // 覆盖光点
        vtCtx.save();
        vtCtx.beginPath(); vtCtx.arc(cx, cy, 5, 0, Math.PI * 2); 
        vtCtx.fillStyle = '#ffffff'; vtCtx.shadowColor = '#06b6d4'; vtCtx.shadowBlur = 10; vtCtx.fill(); 
        vtCtx.restore();
    }

    /* ==========================================================
       5. 学术化 1D 滑块模拟 (严格分层，防遮挡)
       ========================================================== */
    function drawBoundedVector(ctx, startX, startY, value, scale, color, labelText, layer) {
        if (Math.abs(value) < 0.5) return;
        
        // 智能限制矢量长度防止冲出屏幕
        const maxLen = mW * 0.35; 
        let length = Math.sign(value) * Math.min(Math.abs(value * scale), maxLen);
        
        // 强制边界限制，防止起始位置太靠边导致箭头出界
        let endX = startX + length;
        const padding = 20;
        if (endX > mW - padding) endX = mW - padding;
        if (endX < padding) endX = padding;
        
        const sign = Math.sign(endX - startX) || 1; // 修正后实际的箭头方向
        
        ctx.save();
        ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(endX, startY);
        ctx.lineTo(endX - sign * 8, startY - 4); ctx.moveTo(endX, startY); ctx.lineTo(endX - sign * 8, startY + 4);
        
        ctx.strokeStyle = color; ctx.lineWidth = 2.5; 
        ctx.lineJoin = 'miter'; ctx.lineCap = 'round'; ctx.stroke();
        ctx.restore();

        // 标签：采用 Pill 样式，并根据层级 (layer) 判断放箭头上还是下
        const labelY = layer === 'top' ? startY - 10 : startY + 22;
        const align = sign > 0 ? 'left' : 'right';
        const labelX = endX + sign * 6;
        
        drawPillLabel(ctx, labelText, labelX, labelY, color, align);
    }

    function drawMotionStage(model, currX, currV, currA) {
        if (!mW || !mH) return;
        motionCtx.clearRect(0, 0, mW, mH);

        const displayV = Math.abs(currV) < 0.05 ? 0 : currV;
        const displayA = Math.abs(currA) < 0.05 ? 0 : currA;

        // --- 1. X轴底座 ---
        motionCtx.save();
        motionCtx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; motionCtx.lineWidth = 2;
        motionCtx.beginPath(); motionCtx.moveTo(20, motionAxisY); motionCtx.lineTo(mW - 30, motionAxisY); motionCtx.stroke();

        motionCtx.beginPath(); motionCtx.moveTo(mW - 30, motionAxisY); motionCtx.lineTo(mW - 40, motionAxisY - 4); motionCtx.lineTo(mW - 40, motionAxisY + 4);
        motionCtx.fillStyle = 'rgba(255, 255, 255, 0.4)'; motionCtx.fill();
        motionCtx.font = 'italic 12px "Cambria Math", serif'; motionCtx.fillText('x / m', mW - 25, motionAxisY + 20);

        motionCtx.font = '12px Consolas'; motionCtx.textAlign = 'center';
        for (let x = -100; x <= 700; x += 100) {
            const px = toMotionX(x);
            motionCtx.beginPath(); motionCtx.moveTo(px, motionAxisY); motionCtx.lineTo(px, motionAxisY + 6);
            if (x === 0) {
                motionCtx.strokeStyle = 'rgba(6, 182, 212, 0.9)'; motionCtx.stroke();
                motionCtx.fillStyle = '#06b6d4'; motionCtx.font = 'bold 13px Consolas';
                motionCtx.fillText(x, px, motionAxisY + 22); motionCtx.font = '12px Consolas';
            } else {
                motionCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; motionCtx.stroke();
                motionCtx.fillStyle = 'rgba(255, 255, 255, 0.5)'; motionCtx.fillText(x, px, motionAxisY + 22);
            }
        }
        motionCtx.restore();

        // --- 2. 位移着色轨迹 ---
        const originPx = toMotionX(0), objPx = toMotionX(currX);
        if (Math.abs(currX) > 1) {
            motionCtx.save(); motionCtx.beginPath(); motionCtx.moveTo(originPx, motionAxisY - 1); motionCtx.lineTo(objPx, motionAxisY - 1);
            motionCtx.strokeStyle = currX > 0 ? 'rgba(217, 70, 239, 0.8)' : 'rgba(239, 68, 68, 0.8)';
            motionCtx.lineWidth = 3; motionCtx.stroke(); motionCtx.restore();
        }

        // --- 3. 精致滑块主体 ---
        const blockSize = 32;
        motionCtx.save();
        
        // 滑块阴影
        motionCtx.shadowColor = 'rgba(0,0,0,0.6)'; motionCtx.shadowBlur = 10; motionCtx.shadowOffsetY = 4;
        
        motionCtx.fillStyle = '#64748b'; // 高级质感灰
        motionCtx.strokeStyle = '#e2e8f0'; 
        motionCtx.lineWidth = 1.5;
        motionCtx.fillRect(objPx - blockSize/2, motionAxisY - blockSize, blockSize, blockSize);
        
        motionCtx.shadowColor = 'transparent'; // 关闭阴影画边框
        motionCtx.strokeRect(objPx - blockSize/2, motionAxisY - blockSize, blockSize, blockSize);
        
        // 质心打点
        motionCtx.beginPath(); motionCtx.arc(objPx, motionAxisY - blockSize/2, 3, 0, Math.PI * 2);
        motionCtx.fillStyle = '#020617'; motionCtx.fill(); motionCtx.restore();

        // --- 4. 严格分层的动力学矢量与防遮挡数值 ---
        const vScale = 1.2, aScale = 5.0; 
        const vText = `v = ${displayV > 0 ? '+' : ''}${displayV.toFixed(1)} m/s`;
        const aText = `a = ${displayA > 0 ? '+' : ''}${displayA.toFixed(1)} m/s²`;
        
        // v 在上层 (top)
        drawBoundedVector(motionCtx, objPx, motionAxisY - blockSize - 12, currV, vScale, '#06b6d4', vText, 'top');
        // a 在下层 (bottom)
        drawBoundedVector(motionCtx, objPx, motionAxisY + 32, currA, aScale, '#f59e0b', aText, 'bottom');
    }

    /* ==========================================================
       6. 动画与调度逻辑
       ========================================================== */
    function render() {
        if (!vtW || !vtH) return;
        const model = MOTIONS[currentMotion], currV = model.getV(time), currA = model.getA(time), currX = model.getX(time);
        
        drawVtStage(model, currV, currA);
        drawMotionStage(model, currX, currV, currA);

        const displayA = Math.abs(currA) < 0.05 ? 0 : currA;
        valT.textContent = time.toFixed(2) + ' s';
        valV.textContent = (currV > 0 ? '+' : '') + currV.toFixed(1) + ' m/s';
        valA.textContent = (displayA > 0 ? '+' : '') + displayA.toFixed(1) + ' m/s²';
        valX.textContent = (currX > 0 ? '+' : '') + currX.toFixed(1) + ' m';
    }

    function animate(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        let dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
        lastTimestamp = timestamp;

        if (playing) {
            time += dt;
            if (time >= MAX_TIME) { time = MAX_TIME; playing = false; playBtn.textContent = '播放 [Space]'; }
        }
        render();
        requestAnimationFrame(animate);
    }

    document.querySelectorAll('.motion-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.motion-btn').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active'); currentMotion = btn.dataset.type;
            time = 0; playing = true; lastTimestamp = performance.now();
            playBtn.textContent = '暂停 [Space]';
        });
    });

    playBtn.addEventListener('click', () => {
        if (time >= MAX_TIME) { time = 0; }
        playing = !playing; lastTimestamp = performance.now();
        playBtn.textContent = playing ? '暂停 [Space]' : '播放 [Space]';
    });

    resetBtn.addEventListener('click', () => { time = 0; playing = true; lastTimestamp = performance.now(); playBtn.textContent = '暂停 [Space]'; });
    window.addEventListener('keydown', (e) => { if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return; if (e.key === ' ') { e.preventDefault(); playBtn.click(); } else if (e.key === 'r' || e.key === 'R') { resetBtn.click(); } });

    resizeCanvas();
    requestAnimationFrame(animate);
})();
</script>
</body>
</html>
