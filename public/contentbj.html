<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>量子深空 · 星辰幻境</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

body{
    position:relative;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* 深邃宇宙光晕层 — 多层次辉光 */
#cosmicGlow{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 30% 20%, rgba(0, 180, 255, 0.12), transparent 45%),
        radial-gradient(circle at 85% 70%, rgba(100, 0, 255, 0.08), transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(0, 255, 200, 0.06), transparent 70%);
    filter:blur(90px);
    opacity:0.9;
    z-index:1;
}

/* 暗角增强科技感 */
#vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(circle at center, transparent 35%, rgba(0,0,0,0.6) 100%);
    z-index:2;
}

/* 扫描线/噪点质感 */
#noiseOverlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjciIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMTUiLz48L3N2Zz4=');
    background-repeat:repeat;
    background-size: 300px 300px;
    opacity:0.2;
    mix-blend-mode: overlay;
    z-index:3;
}

</style>
</head>

<body>

<div id="cosmicGlow"></div>
<div id="vignette"></div>
<div id="noiseOverlay"></div>

<canvas id="quantum-bg"></canvas>

<script>
(function() {
    const canvas = document.getElementById('quantum-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let centerX, centerY;

    // ========== 全局动画控制 ==========
    let time = 0;
    let animationId = null;

    // 粒子系统参数（大幅提升数量与动态）
    const PARTICLE_COUNT = 420;          // 粒子数量大幅增加
    const MAX_HISTORY = 12;              // 拖尾长度
    const CONNECTION_DIST = 95;          // 连线距离阈值

    // 颜色池 — 青、蓝、紫、洋红，更炫酷
    const COLOR_PALETTE = [
        { r: 0, g: 255, b: 255 },     // 青
        { r: 0, g: 200, b: 255 },     // 天蓝
        { r: 100, g: 100, b: 255 },   // 淡紫蓝
        { r: 180, g: 80, b: 255 },    // 紫罗兰
        { r: 255, g: 100, b: 200 },   // 粉紫
        { r: 0, g: 255, b: 180 }      // 薄荷青
    ];

    // 粒子类（增强拖尾、色彩变幻、轨道路径）
    class QuantumParticle {
        constructor(layer, colorSeed) {
            this.layer = layer;           // 层级影响大小和速度
            this.colorSeed = colorSeed;
            this.reset();
        }

        reset() {
            // 粒子在围绕中心点的环形区域随机分布
            const angle = Math.random() * Math.PI * 2;
            const radiusRange = Math.min(width, height) * 0.45;
            const radius = Math.random() * radiusRange;
            this.x = centerX + Math.cos(angle) * radius;
            this.y = centerY + Math.sin(angle) * radius;

            // 速度带有旋转趋势 + 随机扰动
            const speedFactor = 0.18 * this.layer;
            this.vx = (Math.random() - 0.5) * speedFactor;
            this.vy = (Math.random() - 0.5) * speedFactor;

            // 添加向心力偏转初始方向
            const dirAngle = Math.atan2(centerY - this.y, centerX - this.x);
            this.vx += Math.cos(dirAngle) * 0.06;
            this.vy += Math.sin(dirAngle) * 0.06;

            this.size = Math.random() * 2.2 * this.layer + 0.6;
            this.alpha = Math.random() * 0.55 + 0.25;
            this.life = Math.random() * 500 + 400;   // 生命周期长一点，但会重置

            // 历史轨迹
            this.history = [];

            // 动态颜色偏移（随时间缓慢变化）
            this.colorOffset = Math.random() * Math.PI * 2;
        }

        update() {
            // 记录历史位置
            this.history.push({ x: this.x, y: this.y });
            if (this.history.length > MAX_HISTORY) {
                this.history.shift();
            }

            // 指向中心的引力（模拟星云旋涡）
            const dx = centerX - this.x;
            const dy = centerY - this.y;
            const dist = Math.hypot(dx, dy);
            // 引力强度随距离变化，远端较弱，近端略强
            const gravity = 0.000025 * (dist * 0.001 + 0.8);
            this.vx += dx * gravity;
            this.vy += dy * gravity;

            // 添加微小切向速度，产生旋转感（时间影响）
            const perpX = -dy * 0.00008;
            const perpY = dx * 0.00008;
            this.vx += perpX;
            this.vy += perpY;

            // 随机布朗运动（增加生动性）
            this.vx += (Math.random() - 0.5) * 0.03;
            this.vy += (Math.random() - 0.5) * 0.03;

            // 速度阻尼，保持运动平滑
            this.vx *= 0.995;
            this.vy *= 0.995;

            this.x += this.vx;
            this.y += this.vy;

            // 边界重置（如果飞离太远）
            const margin = 200;
            if (this.x < -margin || this.x > width + margin || this.y < -margin || this.y > height + margin) {
                this.reset();
            }

            // 生命周期递减，重置时重新焕发
            this.life--;
            if (this.life <= 0) {
                this.reset();
            }

            // 颜色动态偏移（随时间增加色彩变化）
            this.colorOffset += 0.01;
        }

        // 获取当前粒子的颜色 (根据时间和颜色种子)
        getCurrentColor() {
            const idx = Math.floor(this.colorSeed * COLOR_PALETTE.length) % COLOR_PALETTE.length;
            const base = COLOR_PALETTE[idx];
            // 动态微调色调：随时间轻微偏移RGB
            const shift = Math.sin(time * 0.003 + this.colorOffset) * 30;
            let r = Math.min(255, Math.max(0, base.r + shift * 0.3));
            let g = Math.min(255, Math.max(0, base.g + shift));
            let b = Math.min(255, Math.max(0, base.b + shift * 0.8));
            return `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)})`;
        }

        draw() {
            const alphaFactor = Math.min(1, this.life / 300) * this.alpha;
            if (alphaFactor <= 0.02) return;

            // 拖尾绘制（更炫酷半透明光晕）
            for (let i = 0; i < this.history.length; i++) {
                const p = this.history[i];
                const ratio = i / this.history.length;
                const trailAlpha = alphaFactor * (1 - ratio) * 0.35;
                ctx.beginPath();
                ctx.fillStyle = `rgba(${this.getCurrentColor().match(/\d+/g).join(', ')}, ${trailAlpha})`;
                const trailRad = this.size * (ratio * 0.8 + 0.3);
                ctx.arc(p.x, p.y, trailRad, 0, Math.PI * 2);
                ctx.fill();
            }

            // 核心粒子 + 发光效果
            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = `rgba(0, 255, 255, 0.6)`;
            ctx.beginPath();
            ctx.fillStyle = this.getCurrentColor();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 内层高光
            ctx.beginPath();
            ctx.fillStyle = `rgba(255, 255, 255, ${alphaFactor * 0.4})`;
            ctx.arc(this.x, this.y, this.size * 0.6, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // 存储粒子数组
    let particles = [];

    // 初始化粒子
    function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const layer = Math.random() * 1.6 + 0.4;   // 层级 0.4 ~ 2.0
            const colorSeed = Math.random();
            particles.push(new QuantumParticle(layer, colorSeed));
        }
    }

    // ========== 绘制动态网格（旋转的光栅） ==========
    let gridRotation = 0;
    function drawDynamicGrid() {
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(gridRotation);
        ctx.strokeStyle = 'rgba(100, 200, 255, 0.045)';
        ctx.lineWidth = 1.2;
        const gap = 65;
        const offset = (time * 0.2) % gap;
        for (let x = -width; x < width + gap; x += gap) {
            ctx.beginPath();
            ctx.moveTo(x + offset, -height);
            ctx.lineTo(x + offset, height * 2);
            ctx.stroke();
        }
        for (let y = -height; y < height + gap; y += gap) {
            ctx.beginPath();
            ctx.moveTo(-width, y + offset);
            ctx.lineTo(width * 2, y + offset);
            ctx.stroke();
        }
        ctx.restore();
        gridRotation += 0.0008;
    }

    // ========== 旋转的星环外圈（增强视觉） ==========
    function drawRotatingRings() {
        const ringCount = 3;
        for (let i = 0; i < ringCount; i++) {
            const radius = 150 + i * 70 + Math.sin(time * 0.002) * 10;
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(time * 0.0006 * (i + 1));
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(0, 255, 255, ${0.08 - i * 0.02})`;
            ctx.lineWidth = 1.2;
            ctx.stroke();
            // 虚线段增加科技感
            ctx.beginPath();
            ctx.arc(0, 0, radius + 10, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(0, 200, 255, ${0.04 - i * 0.01})`;
            ctx.setLineDash([8, 12]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }
    }

    // ========== 中心脉冲光晕（呼吸感） ==========
    function drawPulseCore() {
        const pulse = Math.sin(time * 0.008) * 0.5 + 0.5;
        const rad = 40 + pulse * 25;
        const grad = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, rad);
        grad.addColorStop(0, `rgba(0, 255, 255, ${0.25 + pulse * 0.1})`);
        grad.addColorStop(0.5, `rgba(0, 150, 255, ${0.1})`);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(centerX, centerY, rad + 15, 0, Math.PI * 2);
        ctx.fill();
        
        // 中心亮点
        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + pulse * 0.2})`;
        ctx.arc(centerX, centerY, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    // ========== 粒子之间的连线（增强动态感） ==========
    function drawConnections() {
        // 优化：限制每帧连线数量，但仍保持效果
        for (let i = 0; i < particles.length; i++) {
            const p1 = particles[i];
            if (!p1) continue;
            for (let j = i + 1; j < particles.length; j++) {
                const p2 = particles[j];
                const dx = p1.x - p2.x;
                const dy = p1.y - p2.y;
                const dist = Math.hypot(dx, dy);
                if (dist < CONNECTION_DIST) {
                    const alpha = 0.08 * (1 - dist / CONNECTION_DIST);
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = `rgba(0, 200, 255, ${alpha})`;
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                }
            }
        }
    }

    // ========== 飘浮的星光粒子增强背景 ==========
    let starField = [];
    const STAR_COUNT = 600;
    function initStarfield() {
        for (let i = 0; i < STAR_COUNT; i++) {
            starField.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.2,
                alpha: Math.random() * 0.3,
                twinkleSpeed: 0.5 + Math.random() * 2,
            });
        }
    }
    function drawStarfield() {
        for (let s of starField) {
            const twinkle = Math.sin(time * 0.005 * s.twinkleSpeed) * 0.3 + 0.5;
            ctx.beginPath();
            ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha * twinkle * 0.5})`;
            ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // ========== 鼠标交互 (影响粒子运动方向) ==========
    let mouseX = null, mouseY = null;
    function handleMouseMove(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
    }
    function handleMouseLeave() {
        mouseX = null;
        mouseY = null;
    }
    window.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('mouseleave', handleMouseLeave);

    // 让粒子受到鼠标的斥力/引力 (增加交互惊艳感)
    function applyMouseInfluence() {
        if (mouseX === null || mouseY === null) return;
        for (let p of particles) {
            const dx = p.x - mouseX;
            const dy = p.y - mouseY;
            const dist = Math.hypot(dx, dy);
            if (dist < 180) {
                const force = 0.35 * (1 - dist / 180);
                const angle = Math.atan2(dy, dx);
                p.vx += Math.cos(angle) * force;
                p.vy += Math.sin(angle) * force;
            }
        }
    }

    // ========== 调整画布尺寸并重置粒子位置 ==========
    function resizeAndReset() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        centerX = width / 2;
        centerY = height / 2;
        initParticles();
        initStarfield();
    }

    // 动画主循环
    function animate() {
        time++;
        if (!ctx) return;
        // 清屏用极低透明度拖尾效果，增加光轨
        ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
        ctx.fillRect(0, 0, width, height);

        // 绘制深层星空背景
        drawStarfield();
        // 动态旋转网格
        drawDynamicGrid();
        // 旋转光环
        drawRotatingRings();
        // 中心脉冲光晕
        drawPulseCore();

        // 先更新粒子位置（受鼠标和引力影响）
        for (let p of particles) {
            p.update();
        }
        applyMouseInfluence();

        // 绘制粒子间连线
        drawConnections();

        // 绘制粒子
        for (let p of particles) {
            p.draw();
        }

        // 额外添加一些飞舞的光子特效 (小型光斑)
        if (time % 2 === 0) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < 8; i++) {
                const radAngle = time * 0.02 + i;
                const x = centerX + Math.sin(radAngle) * 110;
                const y = centerY + Math.cos(radAngle * 0.7) * 80;
                ctx.beginPath();
                ctx.fillStyle = `rgba(0, 200, 255, 0.12)`;
                ctx.arc(x, y, 3 + Math.sin(time * 0.05 + i) * 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        animationId = requestAnimationFrame(animate);
    }

    // 初始化
    window.addEventListener('resize', () => {
        resizeAndReset();
    });
    resizeAndReset();
    animate();

    // 清理动画 (页面关闭时可选项)
    window.addEventListener('beforeunload', () => {
        if (animationId) cancelAnimationFrame(animationId);
        window.removeEventListener('mousemove', handleMouseMove);
        window.removeEventListener('mouseleave', handleMouseLeave);
    });
})();
</script>
</body>
</html>
